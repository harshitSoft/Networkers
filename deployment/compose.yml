version: "3.8"

services:
  backend:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_ECR_REPOSITORY}:${BACKEND_TAG}"

    container_name: networkers_backend_${ENVIRONMENT}_${COLOR}

    env_file:
      - backend/.env

    ports:
      - "${HOST_BACKEND_PORT}:8080"

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    
  frontend:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_ECR_REPOSITORY}:${FRONTEND_TAG}"

    container_name: networkers_frontend_${ENVIRONMENT}_${COLOR}

    ports:
      - "${HOST_FRONTEND_PORT}:80"

    restart: always

    depends_on:
      - backend

    healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"