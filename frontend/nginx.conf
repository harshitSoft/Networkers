server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    location / {

        # Serve real files (including /gallery/*.jpg), then fall back to the
        # React entry point for client-side routes such as /gallery.
        # Do not test $uri/ here: /gallery is also a physical asset directory,
        # which makes Nginx return 403 instead of loading the SPA on refresh.
        try_files $uri /index.html;

    }

}
