spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://networkers-new.netlify.app,https://networkers.family,https://www.networkers.family}}
app.seed.admin-email=${ADMIN_EMAIL}
app.seed.admin-password=${ADMIN_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Legacy MySQL settings are preserved in the ignored .env file only.

# Neon PostgreSQL configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=${PORT:${SERVER_PORT:8080}}

app.jwt.secret=${APP_JWT_SECRET:${SPRING_DATASOURCE_PASSWORD}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
spring.mail.default-encoding=UTF-8
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@networkers.local}}

# Store only Cloudinary delivery URLs in PostgreSQL. Set this secret in the
# deployment environment; never commit the real value here.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

cloudinary.folder-root=${CLOUDINARY_FOLDER_ROOT:networkers}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.networkers=DEBUG

